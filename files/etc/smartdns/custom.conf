# ===== 域名分流（迁移自 192.168.11.1 luci domain-rule，修复 luci 模板未渲染问题）=====
# luci-app-smartdns 生成的 UCI domain-rule 不会进入生效配置（bug），
# 真正的分流规则在此文件维护，smartdns.conf 已自动 conf-file 引用本文件。

# 游戏 idle.charsgame.com 等 -> 海外/公共混合组
group-begin g-game
  server 1.1.1.1
  server 1.0.0.1
  server 119.29.29.29
  server 223.5.5.5
group-end
nameserver /idle.charsgame.com/g-game
nameserver /charsgame.com/g-game
nameserver /idle-chars-game.com/g-game

# google / youtube / twitter / openai
group-begin g-gfw
  server 1.1.1.1
  server 8.8.8.8
  server 208.67.222.222
group-end
nameserver /google.com/g-gfw
nameserver /youtube.com/g-gfw
nameserver /twitter.com/g-gfw
nameserver /openai.com/g-gfw

# github
group-begin g-github
  server 1.1.1.1
  server 8.8.8.8
  server 119.29.29.29
group-end
nameserver /github.com/g-github

# baidu
group-begin g-baidu
  server 221.6.4.66
  server 221.6.4.67
  server 180.76.76.76
group-end
nameserver /baidu.com/g-baidu

# taobao
group-begin g-taobao
  server 223.5.5.5
  server 223.6.6.6
  server 221.6.4.66
group-end
nameserver /taobao.com/g-taobao

# qq（weixin.qq.com 为 qq.com 子域，自动被 qq.com 规则覆盖）
group-begin g-qq
  server 119.29.29.29
  server 182.254.116.116
  server 221.6.4.66
group-end
nameserver /qq.com/g-qq
